function openBind(m){s.vehicle=3;s.bindMode=m;s.plate='';s.mileage='';s.brand='长安启源';ensureStore();render()}
function openOther(){s.vehicle=2;s.bindMode='other';s.plate='';s.mileage='';s.brand='';ensureStore();render()}
function otherConfirm(){if(!s.brand.trim())return toast('请输入车辆品牌');if(!s.plate.trim())return toast('请输入车牌号');if(!PLATE_RE.test(s.plate.trim()))return toast('请输入正确的车牌号');s.bindMode=null;toast('已为该车辆选择预约门店范围');go('store')}
function cancelBind(){s.bindMode=null;s.agentMode=false;s.authType='';s.vehicle=0;s.brand='长安启源';s.plate='渝A·Q7268';s.mileage='28650';render()}
function bindVehicle(){if(!PLATE_RE.test(s.bindPlate.trim()))return toast('请输入正确的车牌号');if(!VIN_RE.test(s.bindVin.trim()))return toast('车架号为17位字母与数字（不含 I、O、Q）');s.vehicle=3;s.agentMode=false;s.authType='';s.plate=s.bindPlate.trim().toUpperCase();s.mileage=(s.bindMileage||'').trim();s.bindMode=null;if(!supported(s.store))s.store=1;ensureService();toast('车辆绑定成功，到店环检后建立维保档案');go('store')}
function agentNext(){if(!s.contact.trim())return toast('请输入送修人姓名');if(!/^1[3-9]\d{9}$/.test(s.phone))return toast('请输入正确的11位手机号');if(!PLATE_RE.test(s.bindPlate.trim()))return toast('请输入正确的车牌号');if(!VIN_RE.test(s.bindVin.trim()))return toast('请输入17位车架号（不含 I、O、Q）');authChooseModal()}
function authChooseModal(){modal('选择验证方式','<p>系统已根据车架号查询到车主信息，为保障车辆安全，请选择继续方式。</p><div class="bullet">方式一：发送验证短信给车主，授权后本次预约自动建立关联，下次无需重复认证</div><div class="bullet">方式二：无需车主授权，可直接为该车辆预约基础服务</div>','<button class="btn full" onclick="smsAuthModal()">方式一 · 短信授权</button><button class="btn secondary full" onclick="finishAgent(\'direct\')">方式二 · 无需授权继续</button>')}
function smsAuthModal(){modal('车主授权验证',`<p>已向车主手机 138****${String(s.phone).slice(-4)} 发送6位验证码，验证码：<b>123456</b></p><div class="field"><label for="smscode">短信验证码</label><input id="smscode" inputmode="numeric" maxlength="6" placeholder="请输入6位验证码"></div>`,'<button class="btn full" onclick="checkSms()">验证并继续</button><button class="btn secondary full" onclick="closeModal()">取消</button>')}
function checkSms(){const v=($('smscode')?.value||'').trim();if(v!=='123456')return toast('验证码不正确，请输入 123456');finishAgent('sms')}
function finishAgent(type){s.vehicle=3;s.bindMode=null;s.agentMode=true;s.authType=type==='sms'?'已获车主短信授权':'无需车主授权';s.plate=s.bindPlate.trim().toUpperCase();s.mileage=(s.bindMileage||'').trim();ensureStore();closeModal();toast(type==='sms'?'车主授权成功，可继续预约':'已按无需授权方式继续');go('store')}
function pickupNext(){if(!s.contact.trim())return toast('请填写联系人');if(!/^1\d{10}$/.test(s.phone))return toast('请输入有效的11位手机号码');if(s.mode==='pickup'&&!stores[s.store].pickup)return toast('当前门店暂不支持上门取送车');if(s.mode==='pickup'&&!s.address.trim())return toast('请填写详细取车地址');go('confirm')}
function agreement(){modal('预约服务须知','<p>1. 请按预约时间到店；需改约或取消时，可在预约记录操作。</p><p>2. 所示维保金额为预估，未报价项目检测后另行确认。新增项目需取得授权后施工。</p><p>3. 预约工时折扣适用于所选门店、时段及确认项目；特色服务以门店实际提供为准。</p>'+(s.mode==='pickup'?'<p>4. 取送车双程10km内¥58，超出部分需重新报价并确认。交车前核对外观、里程、电量及随车物品。司机与轨迹信息按订单提供。</p>':'')+'<p>5. 联系方式用于预约服务、提醒和履约联系。</p>')}
function submitBooking(){if(!s.consent)return toast('请阅读并同意服务须知');if(!s.service.length)return toast('请选择服务类型');if(!stores[s.store].ok||!supported(s.store))return toast('请选择支持当前品牌的营业门店');if(s.day===7||!s.slot)return toast('请选择可预约时段');if(!s.contact.trim()||!/^1\d{10}$/.test(s.phone))return toast('请补充有效联系人信息');s.booked=true;s.cancelled=false;s.stage=0;s.paid=false;s.delivered=false;s.reviewed=false;s.extra=false;s.edit=false;s.handover0=false;s.handover1=false;s.handover2=false;go('success')}
function saveReschedule(){s.edit=false;toast('改约成功，原预约专员将继续跟进提醒');go('orders')}
function cancelBooking(){modal('确认取消本次预约？','<p>取消后将释放预约时段，取送车与提醒安排同步取消。您可以重新选择时间预约。</p><div class="field"><label for="cancel-reason">取消原因</label><select id="cancel-reason"><option>时间安排有变</option><option>改去其他门店</option><option>暂不需要服务</option></select></div>','<button class="btn full" onclick="s.cancelled=true;s.booked=false;closeModal();render();toast(\'预约已取消，时段已释放\')">确认取消</button><button class="btn secondary full" onclick="closeModal()">保留预约</button>')}
function authorizeWork(){modal('确认本次作业授权',`<p>已选项目：${serviceNames()}${s.extra?'、前雨刮片更换':''}</p><p>本次预估合计：<b>${money(costs().total)}</b>（包含当前优惠及所选取送服务）。</p><p>故障维修、钣喷等未报价项目仍需单独沟通确认，不纳入本次施工授权。</p>`,'<button class="btn full" onclick="s.stage=3;closeModal();go(\'workshop\')">确认授权，开始服务</button><button class="btn secondary full" onclick="closeModal()">返回核对</button>')}
function pay(){if(s.stage<3){toast('请先确认维修工单');return go('workorder')}modal('确认支付',`<div class="center"><p>本次应付金额</p><div class="price blue">${money(costs().total)}</div></div><p>确认支付后将进入完工交车流程。</p>`,'<button class="btn full" onclick="s.paid=true;s.stage=5;closeModal();toast(\'支付成功\');go(\'delivery\')">确认支付</button><button class="btn secondary full" onclick="closeModal()">暂不支付</button>')}
function completeDelivery(){if(!s.paid){toast('请先完成结算');return go('settle')}if(!s.handover0||!s.handover1||!s.handover2)return toast('请核对并勾选全部交车确认项');s.delivered=true;s.stage=6;go('review')}
function submitReview(){if(!s.delivered&&demoReviewIdx===null){toast('请先完成交车确认，再评价');return go('delivery')}if(demoReviewIdx!==null){const i=demoReviewIdx;demoReviewIdx=null;demoOrders[i].reviewed=true;s.orderTab=3;toast('评价已提交');return go('orders')}s.reviewed=true;render()}
function profileModal(){modal('个人资料',`${line('姓名','李先生')}${line('手机号','138****8000')}${line('绑定车辆',esc(s.plate))}${line('常用门店',stores[s.store].short)}`)}
function addressModal(){modal('地址管理',`<p class="tiny">上门取送车默认使用此地址，也可在每次预约时修改。</p><div class="field"><label for="me-address">默认取车地址</label><input id="me-address" value="${esc(s.address)}" placeholder="请填写详细地址及门牌号"></div>`,'<button class="btn full" onclick="saveAddress()">保存地址</button><button class="btn secondary full" onclick="closeModal()">取消</button>')}
function saveAddress(){const v=($('me-address')?.value||'').trim();if(!v)return toast('请填写详细地址');s.address=v;closeModal();render();toast('默认取车地址已更新')}
function qualityModal(){modal('出厂质检记录',[powerSys()+'检查结果已复核','更换件与工单项目一致','底盘紧固 / 轮胎气压已复核','工具、随车物品已清点'].map(v=>`<div class="bullet">${v}</div>`).join('')+`<p>质检人：赵明　完成时间：${clockAdd(slotStart(),72)}</p>`)}
function resetDemo(){modal('重置本次演示','<p>将清空本页交互中产生的预约与服务状态，重新体验完整流程。</p>','<button class="btn full" onclick="location.reload()">重置演示</button>')}
render();
</script></body></html>
